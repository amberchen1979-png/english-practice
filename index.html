  html, body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif; }

  .safe-top { padding-top: env(safe-area-inset-top); }
  ::-webkit-scrollbar { display: none; }
  .word-chip { border-bottom: 2px dotted #a5b4fc; cursor: pointer; transition: background .15s ease; border-radius: 3px; }

    <p class="text-sm text-slate-500 leading-relaxed mb-5">第一次使用，請設定一組「同步碼」。在電腦、手機上都輸入同一組同步碼，兩邊的練習紀錄跟詞彙庫就會自動同步。</p>
    <input type="text" id="syncCodeInput" placeholder="輸入同步碼，例如 amber-0912"

    <div>

            <span id="aiTranslateIcon">✨</span> <span id="aiTranslateLabel">AI 翻譯建議</span>
          </button>
          <span class="text-[11px] text-slate-400">或自己輸入英文翻譯 ↓</span>

        <label class="text-xs font-medium text-slate-400 block mt-3 mb-1.5">英文翻譯</label>
        <textarea id="enInput" rows="2" placeholder="例如：Today is a rainy day"

        <div class="flex justify-end mt-3">

    <!-- 複習（間隔重複） -->

        <span id="reviewCount" class="text-xs font-semibold text-white bg-indigo-600 rounded-full px-2.5 py-1">0</span>

          <h2 class="font-bold text-slate-900">我的詞彙庫</h2>

  </main>

  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-white/95 backdrop-blur border-t border-slate-100 flex" style="padding-bottom: env(safe-area-inset-bottom)">
    <button class="tab-btn active flex-1 flex flex-col items-center gap-1 py-3 text-[11px] font-medium text-slate-400" data-page="today">
      <span class="text-lg leading-none">📝</span><span>今日練習</span><span class="tab-dot w-1 h-1 rounded-full bg-indigo-600 opacity-0"></span>

       style="bottom: 96px" id="toast"></div>

<script>
const firebaseConfig = {

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

<script>
(function(){
  const state = { log: [], vocab: [], streak: {lastDate:null, count:0} };
  let currentWord = null;
  let syncCode = localStorage.getItem('sync-code') || '';
  let docRef = null;
  let saveTimer = null;
  let suppressNextSnapshot = false;
  const REVIEW_INTERVALS = [1, 2, 4, 7, 14, 30]; // 天，依 level 0~5

  // ---------- date helpers ----------
  function todayStrFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayStr(){ return todayStrFromDate(new Date()); }
  function addDays(dateStr, n){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate()+n);
    return todayStrFromDate(dt);
  }
  function yesterdayStr(dateStr){ return addDays(dateStr, -1); }
  function formatDisplayDate(){
    const d = new Date();
    const wk = ['日','一','二','三','四','五','六'][d.getDay()];
    return `${d.getMonth()+1}月${d.getDate()}日 星期${wk}`;
  }
  function escapeHtml(str){ return String(str).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---------- Firestore sync ----------
  function connectSync(){
    docRef = db.collection('englishPractice').doc(syncCode);
    docRef.onSnapshot((snap)=>{
      if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
      const data = snap.data();
      if(data){
        state.log = data.log || [];
        state.vocab = data.vocab || [];
        state.streak = data.streak || {lastDate:null, count:0};
      }
      renderAll();
    }, (err)=>{ showToast('雲端同步發生問題：' + err.message); });
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      suppressNextSnapshot = true;
      docRef.set({ log: state.log, vocab: state.vocab, streak: state.streak })
        .catch(err=> showToast('儲存失敗：' + err.message));
    }, 500);
  }

  function todaysEntry(){ return state.log.find(e => e.date === todayStr()); }
  function ensureTodaysEntry(){
    let e = todaysEntry();
    if(!e){ e = { date: todayStr(), sentences: [] }; state.log.unshift(e); }
    return e;
  }

  function markPracticedIfNeeded(){
    const today = todayStr();
    if(state.streak.lastDate === today){ renderStreak(); return; }
    const y = yesterdayStr(today);
    state.streak.count = (state.streak.lastDate === y) ? state.streak.count + 1 : 1;
    state.streak.lastDate = today;
    scheduleSave();
    renderStreak();
    renderBanner();
  }

  // ---------- toast ----------
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1'; t.style.transform = 'translate(-50%, -4px)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.style.opacity = '0'; t.style.transform = 'translate(-50%, 0)'; }, 2200);
  }

  // ---------- word helpers ----------
  function wordsFromEnglish(en, prefillMap){
    const seen = new Set();
    const list = [];
    en.split(/\s+/).forEach(tok=>{
      const clean = tok.replace(/[^a-zA-Z']/g,'').toLowerCase();
      if(!clean || seen.has(clean)) return;
      seen.add(clean);
      const existing = state.vocab.find(v=>v.en.toLowerCase()===clean);
      const pre = prefillMap && prefillMap[clean];
      list.push({
        en: clean,
        zh: existing ? existing.zh : (pre ? pre.zh : ''),
        def: existing ? (existing.def||'') : ''
      });
    });
    return list;
  }

  // ---------- rendering ----------
  function renderAll(){ renderStreak(); renderBanner(); renderResults(); renderVocab(); renderReview(); }

  function renderStreak(){
    document.getElementById('todayLabel').textContent = formatDisplayDate();
    document.getElementById('streakNum').textContent = state.streak.count || 0;
    const badge = document.getElementById('stampBadge');
    const done = state.streak.lastDate === todayStr();
    badge.className = 'w-14 h-14 rounded-2xl flex flex-col items-center justify-center flex-shrink-0 transition ' + (done ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700');
    document.getElementById('streakNum').className = 'text-lg font-extrabold leading-none';
    document.getElementById('syncTag').textContent = `同步碼：${syncCode}（點此更改）`;
  }

  function renderBanner(){
    const wrap = document.getElementById('bannerWrap');
    const doneToday = state.streak.lastDate === todayStr();
    wrap.innerHTML = doneToday
      ? `<div class="bg-emerald-50 text-emerald-700 text-sm rounded-2xl px-4 py-3 mb-1">✅ 今天已完成練習，連續 ${state.streak.count} 天，太棒了！</div>`
      : `<div class="bg-amber-50 text-amber-700 text-sm rounded-2xl px-4 py-3 mb-1">📝 今天還沒開始練習，別讓連續紀錄中斷囉！</div>`;
  }

  function renderResults(){
    const wrap = document.getElementById('resultsWrap');
    const entry = todaysEntry();
    if(!entry || entry.sentences.length===0){
      wrap.innerHTML = `<div class="text-center text-slate-400 text-sm py-10 leading-relaxed">今天還沒有句子，輸入第一句開始練習吧 📖</div>`;
      return;
    }
    wrap.innerHTML = entry.sentences.map((s, sIdx) => {
      const wordsHtml = s.en.split(/(\s+)/).map(tok=>{
        if(/^\s+$/.test(tok) || tok==='') return tok;
        const clean = tok.replace(/[^a-zA-Z']/g,'').toLowerCase();
        const wIdx = s.words.findIndex(w=>w.en.toLowerCase()===clean);
        if(wIdx===-1) return escapeHtml(tok);
        const defined = s.words[wIdx].zh;
        return `<span class="word-chip ${defined?'':'undefined'}" data-sentence="${sIdx}" data-widx="${wIdx}">${escapeHtml(tok)}</span>`;
      }).join('');
      let scoreHtml = '';
      if(s.lastScore !== undefined && s.lastScore !== null){
        const cls = s.lastScore>=80?'bg-emerald-50 text-emerald-700':(s.lastScore>=50?'bg-amber-50 text-amber-700':'bg-rose-50 text-rose-700');
        scoreHtml = `<span class="text-xs font-semibold rounded-full px-3 py-1.5 ${cls}">跟讀相似度 ${s.lastScore}%</span>`;
      }
      return `
        <div class="bg-white rounded-2xl shadow-sm shadow-slate-200/60 border border-slate-100 p-5 mb-3.5">
          <div class="flex justify-between items-start gap-2 border-b border-dashed border-slate-200 pb-3 mb-3">
            <div class="text-slate-500 text-[15px] flex-1">${escapeHtml(s.zh)}</div>
            <button class="text-rose-400 text-sm px-1" data-del-sentence="${sIdx}" title="刪除這句">🗑</button>
          </div>
          <div class="text-lg leading-relaxed text-slate-900">${wordsHtml}</div>
          <div class="flex items-center gap-2 flex-wrap mt-3.5">
            <button class="play flex items-center gap-1 text-xs font-semibold text-indigo-600 bg-indigo-50 rounded-full px-3.5 py-2" data-sentence="${sIdx}">🔊 示範發音</button>
            <button class="rec flex items-center gap-1 text-xs font-semibold text-indigo-600 bg-indigo-50 rounded-full px-3.5 py-2" data-sentence="${sIdx}">🎤 開始跟讀</button>
            ${scoreHtml}
          </div>
        </div>`;
    }).join('');
  }

  function renderVocab(){
    const list = document.getElementById('vocabList');
    if(state.vocab.length===0){
      list.innerHTML = `<div class="text-center text-slate-400 text-sm py-10">詞彙庫還是空的，點單字或用「新增單字」加入吧 ⭐</div>`;
      return;
    }
    list.innerHTML = state.vocab.map((v,idx)=>`
      <div class="flex justify-between items-start gap-3 py-3.5 border-b border-dashed border-slate-200 last:border-0">
        <div>
          <div class="font-bold text-[17px] text-slate-900">${escapeHtml(v.en)}</div>
          <div class="text-xs text-slate-400 mt-0.5">${escapeHtml(v.def||'')}</div>
          <div class="text-sm text-slate-700 mt-1">${escapeHtml(v.zh)}</div>
          <div class="text-[10px] text-slate-400 mt-1.5">複習等級 ${(v.level||0)}/5${v.nextReview ? '・下次複習 '+v.nextReview : ''}</div>
        </div>
        <div class="flex gap-1.5 flex-shrink-0">
          <button class="speak w-9 h-9 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center" data-word="${escapeHtml(v.en)}">🔊</button>
          <button class="del w-9 h-9 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center" data-idx="${idx}">🗑</button>
        </div>
      </div>
    `).join('');
  }

  // ---------- 間隔重複複習 ----------
  function dueVocab(){
    const t = todayStr();
    return state.vocab
      .map((v, idx)=>({ v, idx }))
      .filter(({v}) => !v.nextReview || v.nextReview <= t);
  }

  function renderReview(){
    const due = dueVocab();
    document.getElementById('reviewCount').textContent = due.length;
    const badge = document.getElementById('reviewBadge');
    if(due.length > 0) badge.classList.remove('hidden'); else badge.classList.add('hidden');

    const wrap = document.getElementById('reviewWrap');
    if(due.length===0){
      wrap.innerHTML = `<div class="text-center text-slate-400 text-sm py-10 leading-relaxed">今天沒有待複習的單字了 🎉<br>去詞彙庫加幾個新單字吧</div>`;
      return;
    }
    const { v, idx } = due[0];
    wrap.innerHTML = `
      <div class="bg-white rounded-2xl shadow-sm shadow-slate-200/60 border border-slate-100 p-7 text-center">
        <div class="text-[11px] text-slate-400 mb-1">還剩 ${due.length} 個待複習</div>
        <div class="text-3xl font-extrabold text-slate-900 mb-2">${escapeHtml(v.en)}</div>
        <button class="reviewSpeak text-xs text-indigo-600 bg-indigo-50 rounded-full px-3 py-1.5 mb-5" data-word="${escapeHtml(v.en)}">🔊 發音</button>
        <div id="reviewAnswerWrap" class="mb-2">
          <button id="reviewShowBtn" class="text-sm font-semibold text-indigo-600 border border-indigo-200 rounded-xl px-5 py-2.5">顯示中文意思</button>
        </div>
        <div class="flex gap-3 mt-5">
          <button class="reviewMiss flex-1 bg-rose-50 text-rose-600 font-semibold rounded-xl py-3 text-sm" data-idx="${idx}">😵 忘記了</button>
          <button class="reviewHit flex-1 bg-emerald-50 text-emerald-600 font-semibold rounded-xl py-3 text-sm" data-idx="${idx}">✅ 記得</button>
        </div>
      </div>`;
  }

  function reviewUpdate(idx, remembered){
    const v = state.vocab[idx];
    if(!v) return;
    let level = v.level || 0;
    level = remembered ? Math.min(5, level + 1) : Math.max(0, level - 1);
    v.level = level;
    v.nextReview = addDays(todayStr(), REVIEW_INTERVALS[level]);
    v.lastReviewed = todayStr();
    scheduleSave();
    renderReview();
    renderVocab();
  }

  // ---------- speech ----------
  function speak(text){
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){ showToast('這台裝置不支援語音播放'); }
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null, recognizingIdx = null;
  function normalizeWords(str){ return str.toLowerCase().replace(/[^a-z0-9'\s]/g,'').split(/\s+/).filter(Boolean); }
  function scoreAgainst(target, spoken){
    const t = normalizeWords(target), s = new Set(normalizeWords(spoken));
    if(t.length===0) return 0;
    let hit=0; t.forEach(w=>{ if(s.has(w)) hit++; });
    return Math.round((hit/t.length)*100);
  }
  function startRecognition(idx, btn){
    if(!SR){ showToast('此瀏覽器不支援語音辨識，改用示範發音跟讀練習吧'); return; }
    if(recognizer && recognizingIdx===idx){ recognizer.stop(); return; }
    try{
      recognizer = new SR();
      recognizer.lang = 'en-US'; recognizer.interimResults = false; recognizer.maxAlternatives = 1;
      recognizingIdx = idx;
      btn.classList.add('bg-rose-500','text-white'); btn.textContent = '🎤 聆聽中…';
      recognizer.onresult = (ev)=>{
        const said = ev.results[0][0].transcript;
        const entry = todaysEntry();
        const sentence = entry.sentences[idx];
        sentence.lastScore = scoreAgainst(sentence.en, said);
        scheduleSave();
        markPracticedIfNeeded();
        renderResults();
        showToast(`你說的是：「${said}」`);
      };
      recognizer.onerror = ()=> showToast('沒有聽清楚，再試一次');
      recognizer.onend = ()=>{ btn.classList.remove('bg-rose-500','text-white'); btn.textContent = '🎤 開始跟讀'; recognizingIdx=null; };
      recognizer.start();
    }catch(e){ showToast('語音辨識啟動失敗'); }
  }

  // ---------- AI 翻譯建議 (Groq via Netlify Function) ----------
  let lastTranslateWords = {};
  async function requestAiTranslate(){
    const zh = document.getElementById('zhInput').value.trim();
    if(!zh){ showToast('請先輸入中文句子'); return; }
    const btn = document.getElementById('aiTranslateBtn');
    const icon = document.getElementById('aiTranslateIcon');
    const label = document.getElementById('aiTranslateLabel');
    btn.disabled = true;
    icon.textContent = '⏳'; icon.classList.add('spin');
    label.textContent = '翻譯中…';
    try{
      const resp = await fetch('/.netlify/functions/translate', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ zh })
      });
      const data = await resp.json();
      if(!resp.ok){ throw new Error(data.error || '翻譯失敗'); }
      document.getElementById('enInput').value = data.en;
      lastTranslateWords = {};
      (data.words||[]).forEach(w=>{ lastTranslateWords[w.en.toLowerCase()] = { zh: w.zh }; });
      showToast('翻譯完成，可再自行調整');
    }catch(e){
      showToast('AI 翻譯失敗：' + e.message + '（可自行輸入英文）');
    }finally{
      btn.disabled = false;
      icon.textContent = '✨'; icon.classList.remove('spin');
      label.textContent = 'AI 翻譯建議';
    }
  }

  // ---------- word / vocab sheet ----------
  function openWordSheet(sentenceIdx, wordIdx){
    const entry = todaysEntry();
    const w = entry.sentences[sentenceIdx].words[wordIdx];
    currentWord = { sentenceIdx, wordIdx };
    const sheet = document.getElementById('sheetContent');
    sheet.innerHTML = `
      <div class="text-2xl font-extrabold text-slate-900 mb-1">${escapeHtml(w.en)}</div>
      <label class="text-xs font-medium text-slate-400 block mt-3 mb-1.5">中文意思</label>
      <input type="text" id="wordZh" value="${escapeHtml(w.zh||'')}" placeholder="輸入中文意思"
        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <label class="text-xs font-medium text-slate-400 block mt-3 mb-1.5">英文簡短解釋（選填）</label>
      <input type="text" id="wordDef" value="${escapeHtml(w.def||'')}" placeholder="像字典一樣的簡短解釋"
        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex gap-2 mt-4">
        <button id="sheetSpeak" class="text-sm font-semibold text-indigo-600 border border-indigo-200 rounded-xl px-4 py-2.5">🔊 發音</button>
        <button id="sheetSaveWord" class="flex-1 bg-indigo-600 text-white font-semibold rounded-xl py-2.5 text-sm">儲存並加入詞彙庫</button>
      </div>`;
    document.getElementById('overlay').classList.remove('hidden'); document.getElementById('overlay').classList.add('flex');
  }
  function closeSheet(){ document.getElementById('overlay').classList.add('hidden'); document.getElementById('overlay').classList.remove('flex'); currentWord = null; }

  function addOrUpdateVocab(en, zh, def){
    const idx = state.vocab.findIndex(v=>v.en.toLowerCase()===en.toLowerCase());
    if(idx===-1){
      state.vocab.unshift({ en, zh, def: def||'', addedAt: todayStr(), level: 0, nextReview: todayStr() });
    }else{
      state.vocab[idx].zh = zh;
      state.vocab[idx].def = def || state.vocab[idx].def;
    }
    scheduleSave();
    renderVocab();
    renderReview();
  }

  // ---------- events: sync code setup ----------
  function initApp(){
    document.getElementById('setupOverlay').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');
    connectSync();
  }
  if(syncCode){ initApp(); }
  document.getElementById('syncCodeConfirmBtn').addEventListener('click', ()=>{
    const val = document.getElementById('syncCodeInput').value.trim();
    if(!val){ showToast('請輸入同步碼'); return; }
    syncCode = val;
    localStorage.setItem('sync-code', syncCode);
    initApp();
  });
  document.getElementById('syncTag').addEventListener('click', ()=>{
    const val = prompt('輸入同步碼（跟另一台裝置要用同一組才會同步）：', syncCode);
    if(val && val.trim()){
      syncCode = val.trim();
      localStorage.setItem('sync-code', syncCode);
      location.reload();
    }
  });

  // ---------- events: AI translate ----------
  document.getElementById('aiTranslateBtn').addEventListener('click', requestAiTranslate);

  // ---------- events: add sentence ----------
  document.getElementById('addSentenceBtn').addEventListener('click', ()=>{
    const zh = document.getElementById('zhInput').value.trim();
    const en = document.getElementById('enInput').value.trim();
    if(!zh || !en){ showToast('中文跟英文都要填喔'); return; }
    const entry = ensureTodaysEntry();
    entry.sentences.push({ zh, en, words: wordsFromEnglish(en, lastTranslateWords), lastScore: null });
    scheduleSave();
    document.getElementById('zhInput').value = '';
    document.getElementById('enInput').value = '';
    lastTranslateWords = {};
    renderResults();
    showToast('已加入！點單字可標記意思');
  });

  // ---------- events: results area ----------
  document.getElementById('resultsWrap').addEventListener('click', (e)=>{
    const delBtn = e.target.closest('[data-del-sentence]');
    if(delBtn){
      const entry = todaysEntry();
      entry.sentences.splice(Number(delBtn.dataset.delSentence), 1);
      scheduleSave();
      renderResults();
      return;
    }
    const chip = e.target.closest('.word-chip');
    if(chip){ openWordSheet(Number(chip.dataset.sentence), Number(chip.dataset.widx)); return; }
    const playBtn = e.target.closest('.play');
    if(playBtn){ speak(todaysEntry().sentences[Number(playBtn.dataset.sentence)].en); return; }
    const recBtn = e.target.closest('.rec');
    if(recBtn){ startRecognition(Number(recBtn.dataset.sentence), recBtn); return; }
  });

  // ---------- events: review tab ----------
  document.getElementById('reviewWrap').addEventListener('click', (e)=>{
    if(e.target.closest('#reviewShowBtn')){
      const due = dueVocab();
      if(due.length===0) return;
      const { v } = due[0];
      document.getElementById('reviewAnswerWrap').innerHTML = `<div class="text-lg text-slate-700">${escapeHtml(v.zh)}</div>${v.def ? `<div class="text-xs text-slate-400 mt-1">${escapeHtml(v.def)}</div>` : ''}`;
      return;
    }
    const speakBtn = e.target.closest('.reviewSpeak');
    if(speakBtn){ speak(speakBtn.dataset.word); return; }
    const missBtn = e.target.closest('.reviewMiss');
    if(missBtn){ reviewUpdate(Number(missBtn.dataset.idx), false); return; }
    const hitBtn = e.target.closest('.reviewHit');
    if(hitBtn){ reviewUpdate(Number(hitBtn.dataset.idx), true); return; }
  });

  // ---------- events: vocab tab ----------
  document.getElementById('vocabList').addEventListener('click', (e)=>{
    const speakBtn = e.target.closest('.speak');
    if(speakBtn){ speak(speakBtn.dataset.word); return; }
    const delBtn = e.target.closest('.del');
    if(delBtn){
      state.vocab.splice(Number(delBtn.dataset.idx),1);
      scheduleSave();
      renderVocab();
      renderReview();
      return;
    }
  });

  document.getElementById('addVocabBtn').addEventListener('click', ()=>{
    currentWord = null;
    const sheet = document.getElementById('sheetContent');
    sheet.innerHTML = `
      <div class="text-lg font-bold text-slate-900 mb-3">新增單字</div>
      <label class="text-xs font-medium text-slate-400 block mb-1.5">英文單字</label>
      <input type="text" id="wordZh_en" placeholder="英文單字" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <label class="text-xs font-medium text-slate-400 block mt-3 mb-1.5">中文意思</label>
      <input type="text" id="wordZh" placeholder="中文意思" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <label class="text-xs font-medium text-slate-400 block mt-3 mb-1.5">英文簡短解釋（選填）</label>
      <input type="text" id="wordDef" placeholder="像字典一樣的簡短解釋" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-[16px] focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="mt-4">
        <button id="sheetSaveNewVocab" class="w-full bg-indigo-600 text-white font-semibold rounded-xl py-2.5 text-sm">儲存</button>
      </div>`;
    document.getElementById('overlay').classList.remove('hidden'); document.getElementById('overlay').classList.add('flex');
  });

  // ---------- overlay events ----------
  document.getElementById('overlay').addEventListener('click', (e)=>{
    if(e.target.id==='overlay') closeSheet();
    if(e.target.id==='sheetSpeak' && currentWord){
      const entry = todaysEntry();
      speak(entry.sentences[currentWord.sentenceIdx].words[currentWord.wordIdx].en);
    }
    if(e.target.id==='sheetSaveWord' && currentWord){
      const zh = document.getElementById('wordZh').value.trim();
      const def = document.getElementById('wordDef').value.trim();
      if(!zh){ showToast('請輸入中文意思'); return; }
      const entry = todaysEntry();
      const w = entry.sentences[currentWord.sentenceIdx].words[currentWord.wordIdx];
      w.zh = zh; w.def = def;
      scheduleSave();
      addOrUpdateVocab(w.en, zh, def);
      renderResults();
      closeSheet();
      showToast('已儲存並加入詞彙庫 ⭐');
    }
    if(e.target.id==='sheetSaveNewVocab'){
      const en = document.getElementById('wordZh_en').value.trim();
      const zh = document.getElementById('wordZh').value.trim();
      const def = document.getElementById('wordDef').value.trim();
      if(!en || !zh){ showToast('請至少填英文單字跟中文意思'); return; }
      addOrUpdateVocab(en, zh, def);
      closeSheet();
      showToast('已加入詞彙庫 ⭐');
    }
  });

  // ---------- tabs ----------
  document.querySelectorAll('nav .tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav .tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
      document.getElementById('page-'+btn.dataset.page).classList.remove('hidden');
      if(btn.dataset.page==='vocab') renderVocab();
      if(btn.dataset.page==='review') renderReview();
    });
  });
})();
</script>
</body>
</html>
